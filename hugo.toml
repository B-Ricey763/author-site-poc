# Site settings — the author only ever needs to touch this file
# (and the Markdown files in content/). Everything here is a placeholder.
baseURL = "https://example.org/"   # <-- replace with the real site address when it goes live
locale = "en-us"
title = "Your Name"                # <-- the author's name

[params]
  authorName = "Your Name"
  authorTagline = "Fantasy, published one chapter at a time."
  bookTitle = "The Ashen Gate"
  bookSubtitle = "A sample serial novel — replace with your own"
